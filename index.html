<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Urushalal — pendamping resmi sertifikasi halal BPJPH untuk UMKM dan korporasi di Indonesia." />
    <meta name="theme-color" content="#1a1a2e" />

    <!-- Favicon — logo Urushalal (PNG 256px, dihasilkan dari public/images/logo) -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph / WhatsApp / LINE -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Urushalal — Urus Sertifikasi Halal Jadi Gampang" />
    <meta property="og:description" content="Pendamping resmi sertifikasi halal BPJPH dan izin edar BPOM untuk UMKM dan korporasi di Indonesia." />
    <meta property="og:url" content="https://sertifikasihalal-chi.vercel.app/" />
    <meta property="og:image" content="https://sertifikasihalal-chi.vercel.app/og-image.png" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Urushalal" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Urushalal — Urus Sertifikasi Halal Jadi Gampang" />
    <meta name="twitter:description" content="Pendamping resmi sertifikasi halal BPJPH dan izin edar BPOM untuk UMKM dan korporasi di Indonesia." />
    <meta name="twitter:image" content="https://sertifikasihalal-chi.vercel.app/og-image.png" />

    <!-- Slide pertama hero = elemen LCP. Fotonya dipasang sebagai
         background-image, jadi browser baru menemukannya setelah CSS diparsing —
         preload ini yang menutup jeda itu. Slide kedua sengaja tidak di-preload:
         baru terlihat 7 detik kemudian dan tidak boleh menyaingi LCP.
         `media` wajib ada di kedua baris: di bawah 640px yang dipakai crop
         potretnya (lihat .hero__bg di styles.css), jadi tanpa pembatas ini
         ponsel ikut mengunduh foto lanskap yang tidak pernah ditampilkan.
         Ambang di sini harus ikut kalau ambang di CSS digeser. -->
    <link
      rel="preload"
      as="image"
      href="/hero-1.jpeg"
      media="(min-width: 641px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero-1-portrait.jpeg"
      media="(max-width: 640px)"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Urushalal — Urus Sertifikasi Halal Jadi Gampang</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
